# Optional receiver for ticket-app/compose.yaml (standalone, direct IMAPS).
services:
  tickets-receiver:
    image: "punto/tickets:${PUNTO_IMAGE_TAG:-local}"
    pull_policy: build
    build:
      context: ..
      dockerfile: ticket-app/Dockerfile
    entrypoint: ["/usr/local/bin/punto-ticket-receiver"]
    environment:
      TICKETS_DB_PATH: /var/lib/punto-tickets/tickets.db
      TICKETS_IMAP_SECRET_DIR: /run/ticket-mail
      TICKETS_IMAP_POLL_SECONDS: "${TICKETS_IMAP_POLL_SECONDS:-30}"
    depends_on:
      tickets:
        condition: service_healthy
    volumes:
      - tickets_data:/var/lib/punto-tickets
      - type: bind
        source: "${TICKETS_IMAP_SECRETS_PATH:?Imposta una directory esistente con i file credenziali IMAP}"
        target: /run/ticket-mail
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tickets_local
