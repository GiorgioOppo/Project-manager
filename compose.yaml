services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      PUBLIC_PORT: "${NPM_HTTP_PORT:-80}"
      PUBLIC_ORIGINS: "${PUBLIC_ORIGINS:-http://localhost,http://127.0.0.1}"
      BIND_HOST: "172.30.20.10"
      PUBLIC_DIR: /app/public
      TZ: Europe/Rome
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,::1,app,db-proxy,db,db2,db3,documents,mail-api,mail-addon,calendar-api,calendar-addon,172.30.20.10,172.30.60.2,172.30.70.2
      no_proxy: localhost,127.0.0.1,::1,app,db-proxy,db,db2,db3,documents,mail-api,mail-addon,calendar-api,calendar-addon,172.30.20.10,172.30.60.2,172.30.70.2
      MAIL_API_URL: https://mail-api:8090
      MAIL_API_TOKEN_FILE: /run/secrets/mail_api_token
      MAIL_API_CA_FILE: /etc/punto/tls/ca.crt
      MAIL_API_NAMESPACE: "${MAIL_API_NAMESPACE:-punto-alerts-v1}"
      CALENDAR_API_URL: https://calendar-api:8091
      CALENDAR_API_TOKEN_FILE: /run/secrets/calendar_api_token
      CALENDAR_API_CA_FILE: /etc/punto/tls/ca.crt
      DB_HOST: db-proxy
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-punto}"
      DB_USER: "${MYSQL_USER:-punto}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env.docker}"
      DB_TLS_MODE: verify_identity
      DB_SSL_CA: /etc/punto/tls/ca.crt
      DOC_DB_HOST: documents
      DOC_DB_PORT: "27017"
      DOC_DB_NAME: "${DOC_DB_NAME:-punto_documents}"
      DOC_DB_USER: "${DOC_DB_USER:-punto_documents}"
      DOC_DB_PASSWORD: "${DOC_DB_PASSWORD:?Esegui manage_cluster.py init o configura le credenziali documentali}"
      DOC_DB_SSL_CA: /etc/punto/tls/ca.crt
      PUNTO_EMAIL: "${PUNTO_EMAIL:?Imposta PUNTO_EMAIL nel file .env.docker}"
      PUNTO_PASSWORD: "${PUNTO_PASSWORD:?Imposta PUNTO_PASSWORD nel file .env.docker}"
    depends_on:
      squid:
        condition: service_healthy
      mail-addon:
        condition: service_healthy
      calendar-addon:
        condition: service_healthy
      db-proxy:
        condition: service_healthy
      documents:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/network-tls/ca.crt:/etc/punto/tls/ca.crt:ro
    secrets:
      - mail_api_token
      - calendar_api_token
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      private_app:
        ipv4_address: 172.30.20.10
        interface_name: private_app
      backend_app:
        ipv4_address: 172.30.30.10
        interface_name: backend_app
      app_egress:
        ipv4_address: 172.30.40.10
        interface_name: app_egress
      mail_api:
        ipv4_address: 172.30.60.10
        interface_name: mail_api
      calendar_api:
        ipv4_address: 172.30.70.10
        interface_name: calendar_api

  calendar-addon:
    build:
      context: ./calendar-addon
    environment:
      CALENDAR_BIND: 172.30.70.2
      CALENDAR_PORT: "8091"
      CALENDAR_ALLOWED_CLIENT: 172.30.70.10
      CALENDAR_API_TOKEN_FILE: /run/secrets/calendar_api_token
      CALENDAR_TOKEN_KEY_FILE: /run/secrets/calendar_token_key
      CALENDAR_TLS_CERT_FILE: /etc/punto/tls/calendar-addon.crt
      CALENDAR_TLS_KEY_FILE: /etc/punto/tls/calendar-addon.key
      CALENDAR_DB_PATH: /var/lib/punto-calendar/calendar.sqlite3
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      CALENDAR_PROXY_URL: http://squid:3128
      CALENDAR_SYNC_INTERVAL: "${CALENDAR_SYNC_INTERVAL:-300}"
      CALENDAR_HTTP_TIMEOUT: "10"
    depends_on:
      squid:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    secrets:
      - calendar_api_token
      - calendar_token_key
      - google_client_secret
    volumes:
      - calendar_addon_data:/var/lib/punto-calendar
      - ./data/network-tls/ca.crt:/etc/punto/tls/ca.crt:ro
      - ./data/network-tls/calendar-addon.crt:/etc/punto/tls/calendar-addon.crt:ro
      - ./data/network-tls/calendar-addon.key:/etc/punto/tls/calendar-addon.key:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "--max-time", "3", "--cacert", "/etc/punto/tls/ca.crt", "https://172.30.70.2:8091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      calendar_api:
        ipv4_address: 172.30.70.2
        interface_name: calendar_api
        aliases:
          - calendar-api
      app_egress:
        ipv4_address: 172.30.40.12
        interface_name: app_egress

  mail-addon:
    build:
      context: ./addon
    environment:
      MAIL_BIND: 172.30.60.2
      MAIL_PORT: "8090"
      MAIL_ALLOWED_CLIENT: 172.30.60.10
      MAIL_API_TOKEN_FILE: /run/secrets/mail_api_token
      MAIL_TLS_CERT_FILE: /etc/punto/tls/mail-addon.crt
      MAIL_TLS_KEY_FILE: /etc/punto/tls/mail-addon.key
      MAIL_LEDGER_PATH: /var/lib/punto-mailer/delivery.sqlite3
      MAIL_SMTP_HOST: "${MAIL_SMTP_HOST:-}"
      MAIL_SMTP_PORT: "${MAIL_SMTP_PORT:-587}"
      MAIL_SMTP_MODE: "${MAIL_SMTP_MODE:-starttls}"
      MAIL_SMTP_FROM: "${MAIL_SMTP_FROM:-}"
      MAIL_SMTP_USER: "${MAIL_SMTP_USER:-}"
      MAIL_SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
      MAIL_PROXY_URL: http://squid:3128
      MAIL_SMTP_TIMEOUT: "20"
    depends_on:
      squid:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    secrets:
      - mail_api_token
      - mail_smtp_password
    volumes:
      - mail_addon_data:/var/lib/punto-mailer
      - ./data/network-tls/ca.crt:/etc/punto/tls/ca.crt:ro
      - ./data/network-tls/mail-addon.crt:/etc/punto/tls/mail-addon.crt:ro
      - ./data/network-tls/mail-addon.key:/etc/punto/tls/mail-addon.key:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "--max-time", "3", "--cacert", "/etc/punto/tls/ca.crt", "https://172.30.60.2:8090/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      mail_api:
        ipv4_address: 172.30.60.2
        interface_name: mail_api
        aliases:
          - mail-api
      app_egress:
        ipv4_address: 172.30.40.11
        interface_name: app_egress

  squid:
    build:
      context: ./docker/squid
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./docker/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      - ./docker/squid/allowed-smtp-domains.txt:/etc/squid/allowed-smtp-domains.txt:ro
      - ./docker/squid/denied-destinations.txt:/etc/squid/denied-destinations.txt:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/proxy-health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      app_egress:
        ipv4_address: 172.30.40.2
        interface_name: app_egress
      proxy_wan:
        ipv4_address: 172.30.50.2
        interface_name: proxy_wan
        gw_priority: 100

  nginx-proxy-manager:
    build:
      context: ./docker/nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${NPM_ADMIN_PORT:-81}:81"
    environment:
      TZ: "${NPM_TZ:-Australia/Brisbane}"
    volumes:
      - ./nginx-proxy-manager/data:/data
      - ./nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      public:
        ipv4_address: 172.30.10.2
        interface_name: public
        gw_priority: 100
      private_app:
        ipv4_address: 172.30.20.2
        interface_name: private_app

  db:
    image: mysql:8.4
    hostname: db
    command:
      - --server-id=1
      - --report-host=db
      - --loose-group-replication-local-address=db:33061
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-punto}"
      MYSQL_USER: "${MYSQL_USER:-punto}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Imposta MYSQL_ROOT_PASSWORD nel file .env.docker}"
      TZ: Europe/Rome
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/cluster.cnf:/etc/mysql/conf.d/cluster.cnf:ro
      - ./data/network-tls/ca.crt:/etc/mysql/tls/ca.crt:ro
      - ./data/network-tls/db.crt:/etc/mysql/tls/server.crt:ro
      - ./data/network-tls/db.key:/etc/mysql/tls/server.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      backend_app:
        ipv4_address: 172.30.30.21
        interface_name: backend_app

  db2:
    image: mysql:8.4
    hostname: db2
    command:
      - --server-id=2
      - --report-host=db2
      - --loose-group-replication-local-address=db2:33061
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-punto}"
      MYSQL_USER: "${MYSQL_USER:-punto}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Imposta MYSQL_ROOT_PASSWORD nel file .env.docker}"
      TZ: Europe/Rome
    volumes:
      - mysql_data_2:/var/lib/mysql
      - ./docker/mysql/cluster.cnf:/etc/mysql/conf.d/cluster.cnf:ro
      - ./data/network-tls/ca.crt:/etc/mysql/tls/ca.crt:ro
      - ./data/network-tls/db2.crt:/etc/mysql/tls/server.crt:ro
      - ./data/network-tls/db2.key:/etc/mysql/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --user=root --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      backend_app:
        ipv4_address: 172.30.30.22
        interface_name: backend_app

  db3:
    image: mysql:8.4
    hostname: db3
    command:
      - --server-id=3
      - --report-host=db3
      - --loose-group-replication-local-address=db3:33061
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-punto}"
      MYSQL_USER: "${MYSQL_USER:-punto}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Imposta MYSQL_PASSWORD nel file .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Imposta MYSQL_ROOT_PASSWORD nel file .env.docker}"
      TZ: Europe/Rome
    volumes:
      - mysql_data_3:/var/lib/mysql
      - ./docker/mysql/cluster.cnf:/etc/mysql/conf.d/cluster.cnf:ro
      - ./data/network-tls/ca.crt:/etc/mysql/tls/ca.crt:ro
      - ./data/network-tls/db3.crt:/etc/mysql/tls/server.crt:ro
      - ./data/network-tls/db3.key:/etc/mysql/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --user=root --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      backend_app:
        ipv4_address: 172.30.30.23
        interface_name: backend_app

  documents:
    image: mongo:8.0
    hostname: documents
    command:
      - mongod
      - --bind_ip
      - 127.0.0.1,172.30.30.30
      - --auth
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /etc/mongo/tls/server.pem
      - --tlsCAFile
      - /etc/mongo/tls/ca.crt
      - --tlsAllowConnectionsWithoutCertificates
      - --tlsDisabledProtocols
      - TLS1_0,TLS1_1
    environment:
      MONGO_INITDB_ROOT_USERNAME: punto_admin
      MONGO_INITDB_ROOT_PASSWORD: "${DOC_DB_ROOT_PASSWORD:?Configura DOC_DB_ROOT_PASSWORD o esegui init}"
      MONGO_INITDB_DATABASE: "${DOC_DB_NAME:-punto_documents}"
      DOC_DB_NAME: "${DOC_DB_NAME:-punto_documents}"
      DOC_DB_USER: "${DOC_DB_USER:-punto_documents}"
      DOC_DB_PASSWORD: "${DOC_DB_PASSWORD:?Configura DOC_DB_PASSWORD o esegui init}"
    volumes:
      - documents_data:/data/db
      - documents_config:/data/configdb
      - ./data/network-tls/ca.crt:/etc/mongo/tls/ca.crt:ro
      - ./data/network-tls/documents.pem:/etc/mongo/tls/server.pem:ro
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
      - ./docker/mongodb/health.js:/etc/mongo/health.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "localhost", "--tls", "--tlsCAFile", "/etc/mongo/tls/ca.crt", "--file", "/etc/mongo/health.js"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      backend_app:
        ipv4_address: 172.30.30.30
        interface_name: backend_app

  db-proxy:
    build:
      context: ./docker/db-proxy
    environment:
      CLUSTER_MONITOR_PASSWORD: "${CLUSTER_MONITOR_PASSWORD:?Imposta CLUSTER_MONITOR_PASSWORD oppure esegui manage_cluster.py init}"
      CLUSTER_SSL_CA: /etc/punto/tls/ca.crt
    volumes:
      - ./data/network-tls/ca.crt:/etc/punto/tls/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      db2:
        condition: service_healthy
      db3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/punto-db-health.py", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      backend_app:
        ipv4_address: 172.30.30.20
        interface_name: backend_app

volumes:
  mail_addon_data:
  calendar_addon_data:
  mysql_data:
  mysql_data_2:
  mysql_data_3:
  documents_data:
  documents_config:

secrets:
  mail_api_token:
    file: ./data/addon-secrets/mail-api-token
  mail_smtp_password:
    file: ./data/addon-secrets/smtp-password
  calendar_api_token:
    file: ./data/addon-secrets/calendar-api-token
  calendar_token_key:
    file: ./data/addon-secrets/calendar-token-key
  google_client_secret:
    file: ./data/addon-secrets/google-client-secret

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  private_app:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.20.0/24
  backend_app:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.30.0/24
  app_egress:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.40.0/24
  proxy_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
  mail_api:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.60.0/24
  calendar_api:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.70.0/24
