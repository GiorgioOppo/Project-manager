# Explicit outbound proxy: no transparent interception or TLS decryption.
http_port 172.30.40.2:3128
tcp_outgoing_address 172.30.50.2
icp_port 0
htcp_port 0
pinger_enable off
visible_hostname punto-egress
cache_effective_user squid-egress
cache_effective_group squid-egress
pid_filename /tmp/squid.pid

acl app_clients src 172.30.40.10/32
acl mail_clients src 172.30.40.11/32
acl calendar_clients src 172.30.40.12/32
acl ticket_mail_clients src 172.30.40.13/32
acl proxy_clients src 172.30.40.10/32 172.30.40.11/32 172.30.40.12/32 172.30.40.13/32
acl tls_ports port 443
acl smtp_ports port 465 587
acl imap_ports port 993
acl ip_literals dstdom_regex -n ^[0-9.]+$ :
acl calendar_domains dstdomain -n "/etc/squid/allowed-domains.txt"
acl smtp_domains dstdomain -n "/etc/squid/allowed-smtp-domains.txt"
acl imap_domains dstdomain -n "/etc/squid/allowed-imap-domains.txt"
acl denied_destinations dst "/etc/squid/denied-destinations.txt"

http_access deny manager
http_access deny !proxy_clients
http_access deny !CONNECT
http_access deny ip_literals
# Reject unknown hosts before resolving them; -n prevents reverse-DNS matches.
http_access deny app_clients !tls_ports
http_access deny app_clients !calendar_domains
http_access deny mail_clients !smtp_ports
http_access deny mail_clients !smtp_domains
http_access deny calendar_clients !tls_ports
http_access deny calendar_clients !calendar_domains
http_access deny ticket_mail_clients !imap_ports
http_access deny ticket_mail_clients !imap_domains
# Also reject private/reserved answers for an otherwise permitted hostname.
http_access deny denied_destinations
http_access allow app_clients CONNECT tls_ports calendar_domains
http_access allow mail_clients CONNECT smtp_ports smtp_domains
http_access allow calendar_clients CONNECT tls_ports calendar_domains
http_access allow ticket_mail_clients CONNECT imap_ports imap_domains
http_access deny all
host_verify_strict on

cache deny all
cache_mem 0 MB
cache_store_log none
coredump_dir /tmp
cache_log /dev/stderr
logfile_rotate 0
# Domain and result only: omit headers, credentials, URL paths and queries.
logformat egress %ts.%03tu %>a %rm %>rd %Ss/%03>Hs %<st
access_log stdio:/dev/stdout egress
forwarded_for delete
shutdown_lifetime 3 seconds
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 1 minute
