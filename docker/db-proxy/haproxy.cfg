global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 5s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s

frontend mysql
    bind :3306
    default_backend mysql_writers

backend mysql_writers
    mode tcp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host 127.0.0.1
    http-check expect status 200
    default-server check inter 2s fastinter 1s downinter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server db db:3306 addr 127.0.0.1 port 9201
    server db2 db2:3306 addr 127.0.0.1 port 9202
    server db3 db3:3306 addr 127.0.0.1 port 9203
