# OAuth callback parameters and referrers must not enter access logs.
log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server]';
log_format standard '[$time_local] $status - $request_method $scheme $host "$uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio]';

access_log /data/logs/fallback_http_access.log proxy;
